name: Azure Static Web Apps CI/CD

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    # Same reasoning as react-app's workflow: PR previews vs the real prod
    # deploy get different GitHub Environments, so required-reviewer rules
    # (if you set them up later) only gate production.
    environment:
      name: ${{ github.event_name == 'push' && 'production' || 'preview' }}
    # Build ręcznie (nie przez Oryx w akcji SWA) - identyczny powód i
    # identyczne obejście co w react-app: pnpm CELOWO ignoruje `${GITHUB_TOKEN}`
    # w .npmrc zacommitowanym do repo (project .npmrc jest "untrusted" dla
    # credentiali - patrz warning "Ignored project-level auth setting..." /
    # https://pnpm.io/npmrc), więc token trzeba wstrzyknąć jawnie przez
    # `pnpm config set` w osobnym stepie PRZED `pnpm install`.
    env:
      GITHUB_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Configure registry auth
        run: pnpm config set "//npm.pkg.github.com/:_authToken" "$GITHUB_TOKEN"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # REACT_APP_REMOTE_URL musi wskazywać na wdrożone react-app (Module
      # Federation remote), inaczej webpack.config.ts wpisze do builda
      # produkcyjnego fallback `http://localhost:8081`, który w
      # produkcyjnym buildzie oczywiście nigdzie nie prowadzi.
      # Ustawiony jako repo variable (nie sekret - to publiczny URL), patrz
      # Settings -> Secrets and variables -> Actions -> Variables ->
      # REACT_APP_REMOTE_URL, wartość z Job Summary przebiegu react-app.
      - name: Build
        run: pnpm build
        env:
          REACT_APP_REMOTE_URL: ${{ vars.REACT_APP_REMOTE_URL }}

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "dist"
          api_location: ""
          output_location: ""
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
