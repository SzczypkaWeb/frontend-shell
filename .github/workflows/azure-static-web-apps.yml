name: Azure Static Web Apps CI/CD

on:
  push:
    branches: [main, staging]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    # Same reasoning as react-app's workflow: three cases (prod / staging /
    # PR preview), only prod counts as "production" for GitHub Environment
    # protection rules (required reviewers etc.), if those get set up later.
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || (github.ref == 'refs/heads/staging' && 'staging' || 'preview') }}
    # Manual build (not via Oryx in the SWA action) - same reason and same
    # workaround as react-app: pnpm DELIBERATELY ignores `${GITHUB_TOKEN}` in
    # a .npmrc committed to the repo (a project .npmrc is "untrusted" for
    # credentials - see the "Ignored project-level auth setting..." warning /
    # https://pnpm.io/npmrc), so the token has to be injected explicitly via
    # `pnpm config set` in a separate step BEFORE `pnpm install`.
    env:
      GITHUB_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Configure registry auth
        run: pnpm config set "//npm.pkg.github.com/:_authToken" "$GITHUB_TOKEN"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Lint + Vitest run as part of this same job (not a separate PR-only
      # job) so a failure here blocks the job as a whole - including the
      # Azure preview deploy below - and shows up as ONE required status
      # check ("Build and Deploy Job") in branch protection, instead of
      # needing two green checks kept in sync.
      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # REACT_APP_REMOTE_URL has to point at the deployed react-app (Module
      # Federation remote), otherwise webpack.config.ts bakes the production
      # build's fallback `http://localhost:8081` into it, which obviously
      # goes nowhere in a production build.
      #
      # API_URL has to point at the deployed backend (GCP Cloud Run) -
      # otherwise `src/api/config.ts` bakes the fallback `http://localhost:3000`
      # into the build, and the "Zaloguj się przez Google" ("Log in with
      # Google") button in production links to localhost. This specific
      # variable was actually missing (found while debugging login
      # redirecting to localhost:8080 - the link went to the developer's
      # local backend, not the production one).
      #
      # A push to `staging` takes a separate set of values (`*_STAGING`), so
      # staging frontend-shell talks to staging react-app and backend, not
      # production. PR previews (pull_request event) deliberately fall back
      # to production values - there's no separate backend/react-app for
      # previews alone, this is unchanged from how it already worked.
      #
      # All as repo variables (not secrets - these are public URLs), see
      # Settings -> Secrets and variables -> Actions -> Variables.
      # SENTRY_DSN was never actually wired into this build until now - the
      # webpack.config.ts DefinePlugin has always fallen back to an empty
      # string, meaning Sentry.init() in bootstrap.tsx has been running with
      # dsn: '' in every production build to date (silently a no-op - Sentry
      # doesn't error on an empty DSN, it just doesn't send anything). Found
      # while auditing testing/Sentry coverage across all frontend repos -
      # see BLOG_NOTES.md. A DSN isn't a secret (Sentry's own docs treat it
      # as safe to expose in client-side code, same as a project ID), so
      # it's a plain repo Variable, same tier as REACT_APP_REMOTE_URL/API_URL
      # above - not Settings -> Secrets.
      - name: Build
        run: pnpm build
        env:
          REACT_APP_REMOTE_URL: ${{ github.ref == 'refs/heads/staging' && vars.REACT_APP_REMOTE_URL_STAGING || vars.REACT_APP_REMOTE_URL }}
          API_URL: ${{ github.ref == 'refs/heads/staging' && vars.API_URL_STAGING || vars.API_URL }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          SENTRY_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || (github.ref == 'refs/heads/staging' && 'staging' || 'preview') }}
          SENTRY_RELEASE: ${{ github.sha }}

      # See the comment on the same parameter in react-app - a stable,
      # persistent URL at `<default-host>-staging.<region>.azurestaticapps.net`,
      # on the same SWA resource, no extra cost.
      - name: Deploy to Azure Static Web Apps
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "dist"
          api_location: ""
          output_location: ""
          skip_app_build: true
          deployment_environment: ${{ github.ref == 'refs/heads/staging' && 'staging' || '' }}

  # See the matching comment in
  # react-app/.github/workflows/azure-static-web-apps.yml - each of the
  # three services (backend, react-app, frontend-shell) re-validates the same
  # shared staging stack after its own deploy.
  #
  # Requires (Settings -> Secrets and variables -> Actions, this repo):
  #   Variables: FRONTEND_SHELL_STAGING_URL (own URL - see the Job Summary of
  #              the deploy above), API_URL_STAGING (already set for the build)
  #   Secrets:   E2E_DATABASE_URL_STAGING (optional - without it the 'app'
  #              project in e2e-tests is safely skipped)
  #              E2E_REPO_PAT (required - see the matching comment in
  #              react-app's workflow for why this is needed separately from
  #              the "Actions -> Access" org permission)
  e2e:
    needs: build_and_deploy_job
    if: github.ref == 'refs/heads/staging'
    uses: szczypkaweb/marketplace-e2e/.github/workflows/e2e.yml@main
    with:
      app_url: ${{ vars.FRONTEND_SHELL_STAGING_URL }}
      api_url: ${{ vars.API_URL_STAGING }}
    secrets:
      E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL_STAGING }}
      E2E_REPO_CHECKOUT_TOKEN: ${{ secrets.E2E_REPO_PAT }}

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
          # app_location isn't actually used by the action's entrypoint when
          # action=close, but the action's own action.yml declares it
          # `required: true` unconditionally - dummy value here just quiets
          # editor/linter warnings, has no runtime effect.
          app_location: "/"
