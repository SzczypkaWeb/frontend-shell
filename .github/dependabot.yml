version: 2

# GitHub Packages is a private registry - Dependabot needs its own token to
# read it (separate from the repo's default GITHUB_TOKEN, which Dependabot
# doesn't get). Add a PAT with `read:packages` as a repo secret named
# DEPENDABOT_PACKAGES_TOKEN (Settings -> Secrets and variables -> Dependabot).
registries:
  github-packages-szczypkaweb:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{secrets.DEPENDABOT_PACKAGES_TOKEN}}

updates:
  # target-branch: staging, not main - dependency bumps go through the same
  # staging validation as any other change before promotion (see
  # orchestrator/repos.py's target_branch, RUNBOOK.md section 4).
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "staging"
    registries:
      - github-packages-szczypkaweb
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
    # Was scoped to just @szczypkaweb/shared-ui via an `allow` block -
    # broadened to general dependency management after a hand-picked major
    # version bump (@nestjs/swagger, in backend) shipped a peer-dependency
    # mismatch that Dependabot would have caught/flagged. `registries` above
    # is still needed specifically for resolving shared-ui from GH Packages.

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
